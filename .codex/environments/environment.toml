version = 1
name = "oa-workspace-improve"

[setup]
script = "bash .codex/python.sh --version"

[[actions]]
name = "准备共享 Python 依赖"
icon = "tool"
command = "bash .codex/python.sh setup"

[[actions]]
name = "合成 CLI 演示"
icon = "test"
command = "bash .codex/python.sh -m pytest -q tests/approvals/test_cli.py::test_demo_runs_collect_preview_submit_and_postcheck"

[[actions]]
name = "本地离线测试"
icon = "test"
command = "bash .codex/python.sh -m pytest -q"

[[actions]]
name = "静态检查"
icon = "tool"
command = "bash .codex/python.sh -m ruff check apps tests"

[[actions]]
name = "本地离线校验"
icon = "test"
command = "bash .codex/python.sh check"
